services:
  app:
    build: .
    container_name: monitoramento-clientes-api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MODE: development
      TOKEN_SECRET: ${TOKEN_SECRET:-default_secret}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/mydatabase}
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: monitoramento-clientes-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
